[build]
command = "npm run build"
publish = ".next"
functions = "netlify/functions"

[[plugins]]
package = "@netlify/plugin-nextjs"

[context.production]
command = "npm run build"

[context.preview]
command = "npm run build"

[context.deploy-preview]
command = "npm run build"

[context.branch-deploy]
command = "npm run build"

# Rewrite rules for Next.js
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Environment variables
[build.environment]
NODE_VERSION = "20.10.0"
NPM_VERSION = "10.0.0"
